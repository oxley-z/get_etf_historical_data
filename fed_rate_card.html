<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美联储目标利率预期看板</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
        }
        .card-container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            box-sizing: border-box;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-bottom: 1px solid #e6e8eb;
            background-color: #fbfbfb;
        }
        .card-header .title {
            font-size: 17px;
            font-weight: bold;
            color: #222;
        }
        .toggle-btn {
            color: #888;
            font-size: 14px;
            cursor: pointer;
        }
        .meta-section {
            padding: 16px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .meta-info {
            font-size: 13px;
            line-height: 1.8;
            color: #444;
        }
        .meta-info span.value {
            font-weight: 600;
            color: #222;
        }
        .calc-icon {
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 13px;
            background: #fafafa;
        }
        .chart-section {
            padding: 12px 20px 20px 20px;
            border-bottom: 1px solid #ececec;
        }
        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .bar-label {
            width: 90px;
            font-size: 13px;
            color: #333;
            text-align: right;
            padding-right: 14px;
        }
        .bar-track {
            flex: 1;
            height: 18px;
            background: #f1f3f5;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.4s ease;
        }
        .bar-val {
            width: 60px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            padding-left: 10px;
        }
        .table-section {
            padding: 14px 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: right;
        }
        th {
            color: #222;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        th:first-child, td:first-child {
            text-align: left;
        }
        td {
            padding: 9px 0;
            border-bottom: 1px solid #f2f2f2;
            color: #333;
        }
        .rate-range {
            display: flex;
            align-items: center;
            font-weight: 600;
        }
        .sparkline-icon {
            margin-left: 8px;
            font-size: 12px;
            opacity: 0.6;
        }
        .card-footer {
            padding: 8px 20px 14px 20px;
            font-size: 12px;
            color: #666;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <span class="title">2026年10月29日</span>
        <span class="toggle-btn">▲</span>
    </div>

    <div class="meta-section">
        <div class="meta-info">
            <div>会议时间：<span class="value">2026年10月29日 02:00</span></div>
            <div>期货价格：<span class="value">96.105</span></div>
        </div>
        <div class="calc-icon">🖩</div>
    </div>

    <div class="chart-section">
        
        <div class="bar-row">
            <span class="bar-label">3.75 - 4.00</span>
            <div class="bar-track">
                <div class="bar-fill" style="width: 42.6%; background-color: #4a7eb5;"></div>
            </div>
            <span class="bar-val">42.6%</span>
        </div>
        
        <div class="bar-row">
            <span class="bar-label">4.00 - 4.25</span>
            <div class="bar-track">
                <div class="bar-fill" style="width: 57.4%; background-color: #a6a6a6;"></div>
            </div>
            <span class="bar-val">57.4%</span>
        </div>
        
    </div>

    <div class="table-section">
        <table>
            <thead>
                <tr>
                    <th>目标利率</th>
                    <th>目前</th>
                    <th>上一日</th>
                    <th>上一周</th>
                </tr>
            </thead>
            <tbody>
                
        <tr>
            <td class="rate-range">
                <span>3.50 - 3.75</span>
                <span class="sparkline-icon">📈</span>
            </td>
            <td>—</td>
            <td>—</td>
            <td>28.0%</td>
        </tr>
        
        <tr>
            <td class="rate-range">
                <span>3.75 - 4.00</span>
                <span class="sparkline-icon">📈</span>
            </td>
            <td>42.6%</td>
            <td>44.9%</td>
            <td>54.1%</td>
        </tr>
        
        <tr>
            <td class="rate-range">
                <span>4.00 - 4.25</span>
                <span class="sparkline-icon">📈</span>
            </td>
            <td>57.4%</td>
            <td>55.1%</td>
            <td>18.0%</td>
        </tr>
        
            </tbody>
        </table>
    </div>

    <div class="card-footer">
        更新: 2026年09月17日 19:37 CST
    </div>
</div>

</body>
</html>
